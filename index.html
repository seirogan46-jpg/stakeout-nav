<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="逆打ちナビ">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0a0f1e">
<title>逆打ちナビ</title>

<style>
/* ── Design tokens ─────────────────────────────── */
:root {
  --bg:        #0a0f1e;
  --surface:   #111827;
  --surface2:  #1c2537;
  --border:    #2a3550;
  --accent:    #3b82f6;
  --accent2:   #f59e0b;
  --danger:    #ef4444;
  --success:   #22c55e;
  --text:      #f1f5f9;
  --muted:     #64748b;
  --muted2:    #94a3b8;
  --radius:    14px;
  --font-mono: 'SF Mono', 'Courier New', monospace;
  --tab-h:     64px;
  --safe-b:    env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%; background: var(--bg);
  color: var(--text); font-family: -apple-system, 'Hiragino Sans', sans-serif;
  overscroll-behavior: none;
}

/* ── Layout ────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100dvh; }

.page {
  display: none; flex: 1; overflow-y: auto;
  padding: 14px 14px calc(var(--tab-h) + var(--safe-b) + 14px);
  -webkit-overflow-scrolling: touch;
}
.page.active { display: block; }

/* ── Tab Bar ───────────────────────────────────── */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(10,15,30,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
}
.tab-btn {
  flex: 1; border: none; background: none;
  color: var(--muted); font-size: 10px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; padding-top: 6px; cursor: pointer;
  transition: color .15s;
}
.tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tab-btn.active { color: var(--accent); }

/* ── Cards ─────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted2); margin-bottom: 10px;
}

/* ── GPS Bar ───────────────────────────────────── */
.gps-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; margin-bottom: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; font-size: 12px;
}
.gps-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0; transition: background .3s;
}
.gps-dot.ok { background: var(--success); animation: blink 2s infinite; }
.gps-dot.warn { background: var(--accent2); }
.gps-dot.err { background: var(--danger); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
.gps-text { flex: 1; color: var(--muted2); }
.acc-badge {
  font-size: 10px; font-weight: 600; padding: 2px 8px;
  border-radius: 20px; background: var(--surface2);
}
.acc-badge.hi { color: var(--success); }
.acc-badge.mid { color: var(--accent2); }
.acc-badge.lo { color: var(--danger); }

/* ── Target Card ───────────────────────────────── */
.target-card {
  text-align: center; padding: 16px;
}
.target-label { font-size: 11px; color: var(--muted2); margin-bottom: 4px; }
.target-name { font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 6px; }
.target-coord {
  font-size: 11px; color: var(--muted); font-family: var(--font-mono);
  white-space: pre-wrap; line-height: 1.7;
}
.point-counter {
  font-size: 11px; color: var(--muted); margin-bottom: 6px;
}

/* ── Compass ───────────────────────────────────── */
.compass-wrap {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0 4px;
}
.compass-ring {
  position: relative; width: 220px; height: 220px;
}
.compass-ring svg { position: absolute; top: 0; left: 0; }

/* ── Metrics ───────────────────────────────────── */
.metrics-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.metric {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px;
}
.metric-label { font-size: 10px; color: var(--muted2); margin-bottom: 4px; font-weight: 500; }
.metric-value {
  font-size: 24px; font-weight: 700; font-family: var(--font-mono);
  color: var(--text); line-height: 1; letter-spacing: -.5px;
}
.metric-value.big { font-size: 28px; }
.metric-unit { font-size: 11px; color: var(--muted); margin-left: 2px; }
.metric.arrived-flash { border-color: var(--success); background: rgba(34,197,94,.08); }

/* ── Arrived Banner ────────────────────────────── */
.arrived-banner {
  display: none; align-items: center; justify-content: center; gap: 8px;
  padding: 12px; margin-bottom: 12px;
  background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.4);
  border-radius: 12px; font-weight: 600; color: var(--success); font-size: 15px;
}
.arrived-banner.show { display: flex; }

/* ── Threshold Card ────────────────────────────── */
.threshold-card { margin-bottom: 12px; }
.threshold-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.threshold-val {
  font-size: 20px; font-weight: 700; font-family: var(--font-mono);
  color: var(--accent);
}
input[type=range] {
  width: 100%; -webkit-appearance: none; height: 4px;
  background: var(--border); border-radius: 2px; outline: none; margin-bottom: 10px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
  box-shadow: 0 2px 8px rgba(59,130,246,.5);
}
.preset-row { display: flex; gap: 6px; flex-wrap: wrap; }
.preset-btn {
  font-size: 12px; font-weight: 500; padding: 5px 11px;
  border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted2); cursor: pointer;
  transition: all .15s;
}
.preset-btn.active { background: rgba(59,130,246,.2); border-color: var(--accent); color: var(--accent); }

/* ── Control Buttons ───────────────────────────── */
.ctrl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.btn {
  padding: 13px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity .15s;
}
.btn:active { opacity: .7; }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
  grid-column: 1 / -1;
}
.btn.success {
  background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.4);
  color: var(--success); grid-column: 1 / -1;
}

/* ── Map ───────────────────────────────────────── */
#map-container {
  position: fixed; top: 0; left: 0; right: 0;
  bottom: calc(var(--tab-h) + var(--safe-b));
  display: none;
}
#map-container.active { display: block; }
#map { width: 100%; height: 100%; }
.map-follow-btn {
  position: absolute; top: 14px; right: 14px; z-index: 10;
  width: 44px; height: 44px; border-radius: 12px;
  background: rgba(10,15,30,.85); backdrop-filter: blur(10px);
  border: 1px solid var(--border); color: var(--text);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.map-follow-btn.following { color: var(--accent); border-color: var(--accent); }

/* ── Point List ────────────────────────────────── */
.point-list { display: flex; flex-direction: column; gap: 6px; }
.point-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; transition: border-color .15s;
}
.point-item.selected { border-color: var(--accent); background: rgba(59,130,246,.07); }
.point-item.arrived .point-badge { background: var(--success); }
.point-badge {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: var(--surface2); display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700;
  color: var(--muted2); transition: background .2s;
}
.point-item.selected .point-badge { background: var(--accent); color: #fff; }
.point-info { flex: 1; min-width: 0; }
.point-name { font-size: 14px; font-weight: 500; }
.point-coords { font-size: 10px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.point-dist { font-size: 12px; font-weight: 600; color: var(--muted2); white-space: nowrap; }
.point-dist.near { color: var(--success); }

/* ── Import ────────────────────────────────────── */
.seg-ctrl {
  display: flex; background: var(--surface2); border-radius: 10px; padding: 3px; margin-bottom: 12px;
}
.seg-btn {
  flex: 1; padding: 8px; border-radius: 8px; border: none;
  background: none; color: var(--muted2); font-size: 13px; cursor: pointer; transition: all .15s;
}
.seg-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

.zone-selector {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: 10px; background: var(--surface2);
  border: 1px solid var(--border); cursor: pointer; margin-bottom: 10px;
}
.zone-name { font-size: 14px; font-weight: 500; }
.zone-region { font-size: 11px; color: var(--muted); margin-top: 2px; }

textarea {
  width: 100%; min-height: 150px; padding: 10px 12px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: var(--font-mono);
  font-size: 12px; resize: vertical; outline: none; line-height: 1.6;
}
textarea:focus { border-color: var(--accent); }

.import-actions { display: flex; gap: 8px; margin-top: 10px; }
.import-actions .btn { flex: 1; }
.import-actions .btn.primary { grid-column: auto; }

.format-hint {
  font-size: 11px; color: var(--muted); line-height: 1.7;
  margin-top: 8px; padding: 10px 12px;
  background: var(--surface2); border-radius: 8px;
}
.format-hint code { color: var(--accent2); font-family: var(--font-mono); }

.msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-top: 10px; }
.msg.ok { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); color: var(--success); }
.msg.err { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: var(--danger); }

/* ── Zone Sheet ────────────────────────────────── */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 200; display: none; align-items: flex-end;
}
.sheet-overlay.open { display: flex; }
.sheet {
  width: 100%; max-height: 70dvh; background: var(--surface);
  border-radius: 20px 20px 0 0; border: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding-bottom: var(--safe-b);
}
.sheet-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 10px auto 0;
}
.sheet-title {
  font-size: 14px; font-weight: 600; padding: 12px 16px 8px;
  border-bottom: 1px solid var(--border);
}
.sheet-list { overflow-y: auto; flex: 1; padding: 6px 0; }
.zone-item {
  display: flex; align-items: center; padding: 13px 16px; cursor: pointer;
  border-bottom: 1px solid rgba(42,53,80,.5);
}
.zone-item:active { background: var(--surface2); }
.zone-item-name { font-size: 14px; font-weight: 500; }
.zone-item-region { font-size: 11px; color: var(--muted); margin-top: 2px; }
.zone-item-check { margin-left: auto; color: var(--accent); font-size: 18px; }

/* ── Empty State ───────────────────────────────── */
.empty {
  text-align: center; padding: 48px 24px;
  color: var(--muted); font-size: 14px; line-height: 2;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }

/* ── Compass permission overlay ────────────────── */
.perm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.8);
  z-index: 300; display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.perm-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 28px 24px; text-align: center; max-width: 320px;
}
.perm-card h2 { font-size: 18px; margin-bottom: 10px; }
.perm-card p { font-size: 13px; color: var(--muted2); line-height: 1.7; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="app">

  <!-- ===== PAGE: NAV ============================= -->
  <div class="page active" id="page-nav">
    <div class="gps-bar">
      <div class="gps-dot" id="gpsDot"></div>
      <span class="gps-text" id="gpsText">GPS初期化中...</span>
      <span class="acc-badge" id="accBadge"></span>
    </div>

    <div id="noPointsNav" class="empty">
      <div class="empty-icon">📍</div>
      測点が登録されていません<br>
      <small>「読込」タブからCSVを追加してください</small>
    </div>

    <div id="navContent" style="display:none">
      <div class="arrived-banner" id="arrivedBanner">
        ✅ 目標点に到達しました！
      </div>

      <!-- Target Info -->
      <div class="card target-card">
        <div class="point-counter" id="pointCounter"></div>
        <div class="target-label">目標点</div>
        <div class="target-name" id="targetName">--</div>
        <div class="target-coord" id="targetCoord"></div>
      </div>

      <!-- Compass -->
      <div class="card">
        <div class="compass-wrap">
          <div class="compass-ring">
            <svg id="compassSvg" width="220" height="220" viewBox="0 0 220 220"></svg>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:8px" id="bearingText">方位角: --°</div>
        </div>
      </div>

      <!-- Metrics -->
      <div class="metrics-grid">
        <div class="metric" id="distCard">
          <div class="metric-label">距離</div>
          <div><span class="metric-value big" id="distVal">--</span><span class="metric-unit" id="distUnit">m</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">方位角</div>
          <div><span class="metric-value" id="bearVal">--</span><span class="metric-unit">°</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">現在地 緯度</div>
          <div><span class="metric-value" style="font-size:16px" id="curLat">--</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">現在地 経度</div>
          <div><span class="metric-value" style="font-size:16px" id="curLon">--</span></div>
        </div>
      </div>

      <!-- Threshold -->
      <div class="card threshold-card">
        <div class="threshold-row">
          <div>
            <div class="card-title" style="margin:0 0 2px">到達判定</div>
            <div style="font-size:11px;color:var(--muted)">この距離以内で到達と判定</div>
          </div>
          <div class="threshold-val" id="thresholdDisplay">1.5 m</div>
        </div>
        <input type="range" id="thresholdSlider" min="0.1" max="50" step="0.1" value="1.5">
        <div class="preset-row">
          <button class="preset-btn" data-v="0.3">0.3m</button>
          <button class="preset-btn" data-v="0.5">0.5m</button>
          <button class="preset-btn active" data-v="1.5">1.5m</button>
          <button class="preset-btn" data-v="2">2m</button>
          <button class="preset-btn" data-v="5">5m</button>
          <button class="preset-btn" data-v="10">10m</button>
        </div>
      </div>

      <!-- Controls -->
      <div class="ctrl-row">
        <button class="btn" id="prevBtn" onclick="prevPoint()">◀ 前の点</button>
        <button class="btn" id="nextBtn" onclick="nextPoint()">次の点 ▶</button>
      </div>
      <button class="btn success" onclick="markArrived()">🚩 この点に到達済みにする</button>
    </div>
  </div>

  <!-- ===== PAGE: MAP ============================= -->
  <div id="map-container" style="display:none">
    <div id="map"></div>
    <button class="map-follow-btn following" id="followBtn" onclick="toggleFollow()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
    </button>
  </div>

  <!-- ===== PAGE: POINTS ========================== -->
  <div class="page" id="page-points">
    <div id="noPointsList" class="empty">
      <div class="empty-icon">📋</div>
      測点が登録されていません
    </div>
    <div class="point-list" id="pointList"></div>
  </div>

  <!-- ===== PAGE: IMPORT ========================== -->
  <div class="page" id="page-import">
    <div class="card">
      <div class="card-title">座標系</div>
      <div class="seg-ctrl">
        <button class="seg-btn active" id="segLatLon" onclick="setCoordType('latlon')">緯度経度</button>
        <button class="seg-btn" id="segXY" onclick="setCoordType('xy')">平面直角 XY</button>
      </div>

      <div id="zoneSection" style="display:none">
        <div class="card-title">系番号</div>
        <div class="zone-selector" onclick="openZoneSheet()">
          <div>
            <div class="zone-name" id="zoneName">第Ⅸ系</div>
            <div class="zone-region" id="zoneRegion">東京・宮城・茨城・神奈川</div>
          </div>
          <span style="color:var(--muted)">›</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">CSVファイルを読み込む</div>
      <button class="btn" style="width:100%;margin-bottom:8px" onclick="document.getElementById('fileInput').click()">
        📂 ファイルを選択…
      </button>
      <input type="file" id="fileInput" accept=".csv,.txt" style="display:none">
      <div class="format-hint" id="formatHint">
        形式①: <code>点番号, 緯度, 経度</code><br>
        形式②: <code>点番号, 名称, 緯度, 経度</code><br>
        ヘッダー行・スペース区切り・<code>#</code>コメント行 自動認識
      </div>
    </div>

    <div class="card">
      <div class="card-title">テキストを貼り付け</div>
      <textarea id="pasteArea" placeholder="1,38.268340,140.869357&#10;2,38.268420,140.869510"></textarea>
      <div class="import-actions">
        <button class="btn" onclick="loadDemo()">🎲 デモ</button>
        <button class="btn primary" onclick="doImport()">読み込む →</button>
      </div>
    </div>

    <div id="importMsg"></div>
  </div>

  <!-- ===== TAB BAR =============================== -->
  <nav class="tabbar">
    <button class="tab-btn active" id="tab-nav" onclick="switchTab('nav')">
      <svg viewBox="0 0 24 24"><path d="M12 2L12 22M12 2C12 2 6 8 6 12C6 16 8.5 18 12 18C15.5 18 18 16 18 12C18 8 12 2 12 2Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ナビ
    </button>
    <button class="tab-btn" id="tab-map" onclick="switchTab('map')">
      <svg viewBox="0 0 24 24"><polygon points="1,6 1,22 8,18 16,22 23,18 23,2 16,6 8,2"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      地図
    </button>
    <button class="tab-btn" id="tab-points" onclick="switchTab('points')">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      測点
    </button>
    <button class="tab-btn" id="tab-import" onclick="switchTab('import')">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      読込
    </button>
  </nav>
</div>

<!-- Zone Sheet -->
<div class="sheet-overlay" id="zoneOverlay" onclick="closeZoneSheet(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">座標系（系番号）を選択</div>
    <div class="sheet-list" id="zoneList"></div>
  </div>
</div>

<script>

// JAPAN PLANE COORDINATE SYSTEM (GRS80 / Gauss-Krüger)
// 国土地理院 算式準拠
// ═══════════════════════════════════════════════════════
const ZONES = [
  { n:1,  name:'第Ⅰ系',   phi0:33,     lam0:129.5,          region:'長崎・鹿児島西部' },
  { n:2,  name:'第Ⅱ系',   phi0:33,     lam0:131.0,          region:'福岡・佐賀・熊本・大分・宮崎・鹿児島' },
  { n:3,  name:'第Ⅲ系',   phi0:36,     lam0:132+1/6,        region:'山口・島根・広島' },
  { n:4,  name:'第Ⅳ系',   phi0:33,     lam0:133.5,          region:'香川・愛媛・徳島・高知' },
  { n:5,  name:'第Ⅴ系',   phi0:36,     lam0:134+1/3,        region:'兵庫・鳥取・岡山' },
  { n:6,  name:'第Ⅵ系',   phi0:36,     lam0:136.0,          region:'京都・大阪・福井・滋賀・三重・奈良・和歌山' },
  { n:7,  name:'第Ⅶ系',   phi0:36,     lam0:137+1/6,        region:'石川・富山・岐阜・愛知' },
  { n:8,  name:'第Ⅷ系',   phi0:36,     lam0:138.5,          region:'新潟・長野・山梨・静岡' },
  { n:9,  name:'第Ⅸ系',   phi0:36,     lam0:139+5/6,        region:'東京・宮城・茨城・埼玉・千葉・神奈川' },
  { n:10, name:'第Ⅹ系',   phi0:40,     lam0:140+5/6,        region:'青森・秋田・山形・岩手・宮城' },
  { n:11, name:'第ⅩⅠ系', phi0:44,     lam0:140.25,         region:'北海道西部（札幌・函館・小樽・室蘭）' },
  { n:12, name:'第ⅩⅡ系', phi0:44,     lam0:142.25,         region:'北海道中部（旭川・帯広・釧路・網走）' },
  { n:13, name:'第ⅩⅢ系', phi0:44,     lam0:144.25,         region:'北海道東部（根室・釧路東部・北見東部）' },
  { n:14, name:'第ⅩⅣ系', phi0:26,     lam0:142.0,          region:'東京都（父島・母島）' },
  { n:15, name:'第ⅩⅤ系', phi0:26,     lam0:127.5,          region:'沖縄本島・久米島' },
  { n:16, name:'第ⅩⅥ系', phi0:26,     lam0:124.0,          region:'宮古島・八重山諸島' },
  { n:17, name:'第ⅩⅦ系', phi0:26,     lam0:131.0,          region:'南大東島・北大東島' },
  { n:18, name:'第ⅩⅧ系', phi0:20,     lam0:136.0,          region:'沖ノ鳥島' },
  { n:19, name:'第ⅩⅨ系', phi0:26,     lam0:154.0,          region:'南鳥島' },
];

function xyToLatLon(x, y, zoneNo) {
  const z = ZONES.find(z => z.n === zoneNo);
  if (!z) return null;
  const D2R = Math.PI / 180;
  const phi0 = z.phi0 * D2R, lam0 = z.lam0 * D2R;
  const a = 6378137.0, f = 1 / 298.257222101, k0 = 0.9999;
  const b = a * (1 - f);
  const n = (a - b) / (a + b);
  const n2=n*n, n3=n*n2, n4=n*n3;

  const A0 = 1 + n2/4 + n4/64;
  const A2 = 3/2*(n - n3/8);
  const A4 = 15/16*(n2 - n4/4);
  const A6 = 35/48*n3;
  const A8 = 315/512*n4;
  const Ap = a/(1+n)*A0;

  const S0 = Ap*(phi0 - A2/A0*Math.sin(2*phi0) + A4/A0*Math.sin(4*phi0)
                      - A6/A0*Math.sin(6*phi0) + A8/A0*Math.sin(8*phi0));
  const xi  = (x/k0 + S0) / Ap;
  const eta = y / k0 / Ap;

  const b1=n/2 - 2*n2/3 + 37*n3/96 - n4/360;
  const b2=n2/48 + n3/15 - 437*n4/1440;
  const b3=17*n3/480 - 37*n4/840;
  const b4=4397*n4/161280;

  const d1=2*n - 2*n2/3 - 2*n3 + 116*n4/45;
  const d2=7*n2/3 - 8*n3/5 - 227*n4/45;
  const d3=56*n3/15 - 136*n4/35;
  const d4=4279*n4/630;

  const xi2 = xi - b1*Math.sin(2*xi)*Math.cosh(2*eta)
                 - b2*Math.sin(4*xi)*Math.cosh(4*eta)
                 - b3*Math.sin(6*xi)*Math.cosh(6*eta)
                 - b4*Math.sin(8*xi)*Math.cosh(8*eta);
  const eta2 = eta - b1*Math.cos(2*xi)*Math.sinh(2*eta)
                   - b2*Math.cos(4*xi)*Math.sinh(4*eta)
                   - b3*Math.cos(6*xi)*Math.sinh(6*eta)
                   - b4*Math.cos(8*xi)*Math.sinh(8*eta);

  const chi = Math.asin(Math.sin(xi2)/Math.cosh(eta2));
  const phi = chi + d1*Math.sin(2*chi) + d2*Math.sin(4*chi)
                  + d3*Math.sin(6*chi) + d4*Math.sin(8*chi);
  const lam = lam0 + Math.atan(Math.sinh(eta2)/Math.cos(xi2));

  const lat = phi * 180/Math.PI, lon = lam * 180/Math.PI;
  if (lat < 20 || lat > 47 || lon < 122 || lon > 155) return null;
  return { lat, lon };
}

// ═══════════════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════════════
function splitLine(line) {
  return line.includes(',')
    ? line.split(',').map(s => s.trim())
    : line.trim().split(/\s+/);
}

function parseLatLon(text) {
  const points = [];
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')&&!l.startsWith('//'));
  for (let i=0; i<lines.length; i++) {
    const p = splitLine(lines[i]);
    if (p.length < 3) continue;
    const no = p[0];
    let lat, lon, name = 'NO.'+no;
    // NO, lat, lon
    if (!isNaN(+p[1]) && !isNaN(+p[2]) && Math.abs(+p[1])<=90 && Math.abs(+p[2])<=180) {
      lat=+p[1]; lon=+p[2]; if (p[3]) name=p[3];
    }
    // NO, name, lat, lon
    else if (p.length>=4 && !isNaN(+p[2]) && !isNaN(+p[3]) && Math.abs(+p[2])<=90 && Math.abs(+p[3])<=180) {
      lat=+p[2]; lon=+p[3]; name=p[1];
    }
    else { if(i===0) continue; continue; }
    points.push({ no, name, lat, lon, arrived:false });
  }
  if (!points.length) throw new Error('有効なデータ行が見つかりません。\n形式: 点番号,緯度,経度');
  return points;
}

function parsePlaneXY(text, zoneNo) {
  const points = [];
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')&&!l.startsWith('//'));
  for (let i=0; i<lines.length; i++) {
    const p = splitLine(lines[i]);
    if (p.length < 3) continue;
    const no = p[0];
    let x, y, name = 'NO.'+no;
    const isPlane = v => !isNaN(+v) && Math.abs(+v) <= 1500000;
    if (isPlane(p[1]) && isPlane(p[2])) {
      x=+p[1]; y=+p[2]; if(p[3]) name=p[3];
    } else if (p.length>=4 && isPlane(p[2]) && isPlane(p[3])) {
      x=+p[2]; y=+p[3]; name=p[1];
    } else { if(i===0) continue; continue; }
    const ll = xyToLatLon(x, y, zoneNo);
    if (!ll) throw new Error(`行${i+1}: XY→緯度経度 変換失敗。系番号を確認してください。`);
    points.push({ no, name, lat:ll.lat, lon:ll.lon, origX:x, origY:y, zoneNo, arrived:false });
  }
  if (!points.length) throw new Error('有効なデータ行が見つかりません。\n形式: 点番号,X,Y');
  return points;
}

// STATE
// ═══════════════════════════════════════════════════════
let points = [];
let curIdx = 0;
let myLat = null, myLon = null, myAcc = null;
let heading = 0;

let compassPermAsked = false;

// ═══════════════════════════════════════════════════════
// HAVERSINE / BEARING
// ═══════════════════════════════════════════════════════
function haversine(lat1, lon1, lat2, lon2) {
  const R=6371000, r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function calcBearing(lat1,lon1,lat2,lon2) {
  const r=Math.PI/180, dLon=(lon2-lon1)*r;
  const y=Math.sin(dLon)*Math.cos(lat2*r);
  const x=Math.cos(lat1*r)*Math.sin(lat2*r)-Math.sin(lat1*r)*Math.cos(lat2*r)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

// ═══════════════════════════════════════════════════════
// GPS
// ═══════════════════════════════════════════════════════
function initGPS() {
  if (!('geolocation' in navigator)) {
    setGPSStatus('err', 'GPS非対応のブラウザです'); return;
  }
  setGPSStatus('warn', 'GPS取得中...');
  navigator.geolocation.watchPosition(
    pos => {
      myLat = pos.coords.latitude;
      myLon = pos.coords.longitude;
      myAcc = pos.coords.accuracy;
      updateGPSUI();
      updateNav();
      updatePointDistances();
      if (followMap && gMap && myMarker) {
        myMarker.setPosition({lat: myLat, lng: myLon});
        gMap.panTo({lat: myLat, lng: myLon});
      } else if (gMap && myMarker) {
        myMarker.setPosition({lat: myLat, lng: myLon});
      }
    },
    err => {
      setGPSStatus('err', 'GPS取得失敗: ' + err.message);
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
  );
}

function updateGPSUI() {
  const acc = myAcc;
  let cls = 'ok', label = '高精度', levelCls = 'hi';
  if (acc > 15) { cls='warn'; label='低精度'; levelCls='lo'; }
  else if (acc > 5) { cls='warn'; label='良好'; levelCls='mid'; }
  setGPSStatus(cls, `GPS受信中`);
  document.getElementById('accBadge').textContent = `±${acc.toFixed(1)}m  ${label}`;
  document.getElementById('accBadge').className = `acc-badge ${levelCls}`;
}
function setGPSStatus(cls, text) {
  document.getElementById('gpsDot').className = `gps-dot ${cls}`;
  document.getElementById('gpsText').textContent = text;
}

// ═══════════════════════════════════════════════════════
// COMPASS (DeviceOrientationEvent)
// ═══════════════════════════════════════════════════════
function initCompass() {
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS 13+ — will request on first user interaction in switchTab
  } else {
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  }
}

function requestCompassPermission() {
  if (typeof DeviceOrientationEvent.requestPermission !== 'function') return;
  if (compassPermAsked) return;
  compassPermAsked = true;
  DeviceOrientationEvent.requestPermission().then(r => {
    if (r === 'granted') {
      window.addEventListener('deviceorientationabsolute', onOrient, true);
    }
  }).catch(() => {});
}

function onOrient(e) {
  let h = null;
  if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
    h = e.webkitCompassHeading; // iOS: 0=N, 90=E
  } else if (e.absolute && e.alpha !== null) {
    h = (360 - e.alpha) % 360;
  }
  if (h !== null) { heading = h; updateNav(); }
}

// ═══════════════════════════════════════════════════════
// COMPASS SVG DRAW
// ═══════════════════════════════════════════════════════
function drawCompass(relAngle) {
  const svg = document.getElementById('compassSvg');
  const cx=110, cy=110, r=100, ri=88;
  let html = '';

  // Outer ring
  html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a3550" stroke-width="1"/>`;

  // Tick marks
  for (let i=0; i<36; i++) {
    const a=(i*10-90)*Math.PI/180;
    const isMaj = i%9===0;
    const r1 = isMaj ? ri-8 : ri-4;
    const x1=cx+r1*Math.cos(a), y1=cy+r1*Math.sin(a);
    const x2=cx+ri*Math.cos(a), y2=cy+ri*Math.sin(a);
    html += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#2a3550" stroke-width="${isMaj?2:1}"/>`;
  }

  // Cardinal labels
  const cardinals = [['N',0,'#ef4444'],['E',90,'#94a3b8'],['S',180,'#94a3b8'],['W',270,'#94a3b8']];
  for (const [label, deg, color] of cardinals) {
    const a=(deg-90)*Math.PI/180;
    const lr=ri-20;
    html += `<text x="${(cx+lr*Math.cos(a)).toFixed(1)}" y="${(cy+lr*Math.sin(a)+4).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="${label==='N'?14:12}" font-weight="${label==='N'?700:400}" font-family="-apple-system,sans-serif">${label}</text>`;
  }

  // Device-top indicator (fixed triangle at top)
  html += `<polygon points="${cx-5},${cy-r-6} ${cx+5},${cy-r-6} ${cx},${cy-r+2}" fill="#64748b"/>`;

  // Arrow (rotates to relAngle)
  const rad = (relAngle - 90) * Math.PI / 180;
  const arrowLen = 60, arrowW = 10;
  const ax = cx + arrowLen * Math.cos(rad);
  const ay = cy + arrowLen * Math.sin(rad);
  const bx = cx - 18 * Math.cos(rad);
  const by = cy - 18 * Math.sin(rad);
  const px1 = cx + arrowW*Math.cos(rad+Math.PI/2);
  const py1 = cy + arrowW*Math.sin(rad+Math.PI/2);
  const px2 = cx + arrowW*Math.cos(rad-Math.PI/2);
  const py2 = cy + arrowW*Math.sin(rad-Math.PI/2);
  html += `<polygon points="${ax.toFixed(1)},${ay.toFixed(1)} ${px1.toFixed(1)},${py1.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)} ${px2.toFixed(1)},${py2.toFixed(1)}" fill="#3b82f6" opacity="0.9"/>`;

  // Center dot
  html += `<circle cx="${cx}" cy="${cy}" r="5" fill="#f1f5f9"/>`;
  svg.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
// NAV UPDATE
// ═══════════════════════════════════════════════════════
function updateNav() {
  const hasPoints = points.length > 0;
  document.getElementById('noPointsNav').style.display = hasPoints ? 'none' : 'block';
  document.getElementById('navContent').style.display = hasPoints ? 'block' : 'none';
  if (!hasPoints) { drawCompass(0); return; }

  const p = points[curIdx];
  document.getElementById('pointCounter').textContent = `${curIdx+1} / ${points.length}`;
  document.getElementById('targetName').textContent = p.name;

  if (p.origX !== undefined) {
    document.getElementById('targetCoord').textContent =
      `第${p.zoneNo}系  X: ${p.origX.toFixed(3)}\nY: ${p.origY.toFixed(3)}`;
  } else {
    document.getElementById('targetCoord').textContent =
      `${p.lat.toFixed(7)}°N\n${p.lon.toFixed(7)}°E`;
  }

  document.getElementById('prevBtn').disabled = curIdx === 0;
  document.getElementById('nextBtn').disabled = curIdx === points.length - 1;

  if (myLat === null) {
    drawCompass(0);
    return;
  }

  const dist = haversine(myLat, myLon, p.lat, p.lon);
  const bear = calcBearing(myLat, myLon, p.lat, p.lon);
  const rel  = (bear - heading + 360) % 360;

  document.getElementById('curLat').textContent = myLat.toFixed(6);
  document.getElementById('curLon').textContent = myLon.toFixed(6);

  // Distance
  const distEl = document.getElementById('distVal');
  const unitEl = document.getElementById('distUnit');
  if (dist < 1000) { distEl.textContent = dist.toFixed(2); unitEl.textContent = 'm'; }
  else { distEl.textContent = (dist/1000).toFixed(3); unitEl.textContent = 'km'; }

  document.getElementById('bearVal').textContent = bear.toFixed(1);
  document.getElementById('bearingText').textContent = `方位角: ${bear.toFixed(1)}°`;

  // Arrived
  const arrived = dist <= threshold;
  document.getElementById('arrivedBanner').classList.toggle('show', arrived);
  document.getElementById('distCard').classList.toggle('arrived-flash', arrived);

  drawCompass(rel);
  updateMapTarget();
}

// ═══════════════════════════════════════════════════════
// THRESHOLD
// ═══════════════════════════════════════════════════════
function initThreshold() {
  const slider = document.getElementById('thresholdSlider');
  slider.value = threshold;
  updateThresholdUI();

  slider.addEventListener('input', () => {
    threshold = parseFloat(slider.value);
    localStorage.setItem('threshold', threshold);
    updateThresholdUI();
    updateNav();
  });

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      threshold = parseFloat(btn.dataset.v);
      slider.value = threshold;
      localStorage.setItem('threshold', threshold);
      updateThresholdUI();
      updateNav();
    });
  });
}

function updateThresholdUI() {
  const v = threshold;
  const label = v < 1 ? `${v.toFixed(1)} m` : v === Math.floor(v) ? `${v} m` : `${v.toFixed(1)} m`;
  document.getElementById('thresholdDisplay').textContent = label;

  // Slider color
  const pct = ((v - 0.1) / 49.9) * 100;
  const color = v <= 1 ? '#22c55e' : v <= 5 ? '#3b82f6' : '#f59e0b';
  document.getElementById('thresholdSlider').style.background =
    `linear-gradient(to right, ${color} ${pct}%, #2a3550 ${pct}%)`;

  // Preset active
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.classList.toggle('active', Math.abs(parseFloat(btn.dataset.v) - v) < 0.05);
  });
}

// ═══════════════════════════════════════════════════════
// POINT MANAGEMENT
// ═══════════════════════════════════════════════════════
function selectPoint(i) {
  curIdx = i;
  updateNav();
  renderPointList();
}
function prevPoint() { if (curIdx > 0) { curIdx--; updateNav(); renderPointList(); } }
function nextPoint() { if (curIdx < points.length-1) { curIdx++; updateNav(); renderPointList(); } }
function markArrived() {
  if (!points.length) return;
  points[curIdx].arrived = true;
  renderPointList();
  if (curIdx < points.length-1) { curIdx++; updateNav(); }
}

// ═══════════════════════════════════════════════════════
// POINT LIST
// ═══════════════════════════════════════════════════════
function renderPointList() {
  const el = document.getElementById('pointList');
  const empty = document.getElementById('noPointsList');
  if (!points.length) { empty.style.display='block'; el.innerHTML=''; return; }
  empty.style.display = 'none';

  el.innerHTML = points.map((p, i) => {
    const dist = myLat !== null ? haversine(myLat, myLon, p.lat, p.lon) : null;
    const distStr = dist === null ? '' :
      dist < 1000 ? `${dist.toFixed(1)} m` : `${(dist/1000).toFixed(2)} km`;
    const nearCls = dist !== null && dist < 5 ? 'near' : '';
    const selCls  = i === curIdx ? 'selected' : '';
    const arrCls  = p.arrived ? 'arrived' : '';
    const badge   = p.arrived ? '✓' : p.no;
    const coordLine = p.origX !== undefined
      ? `第${p.zoneNo}系 X:${p.origX.toFixed(1)} Y:${p.origY.toFixed(1)}`
      : `${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`;

    return `<div class="point-item ${selCls} ${arrCls}" onclick="selectPoint(${i});switchTab('nav')">
      <div class="point-badge">${badge}</div>
      <div class="point-info">
        <div class="point-name">${p.name}</div>
        <div class="point-coords">${coordLine}</div>
      </div>
      <div class="point-dist ${nearCls}">${distStr}</div>
    </div>`;
  }).join('');
}

function updatePointDistances() {
  if (document.getElementById('page-points').classList.contains('active')) {
    renderPointList();
  }
}

3,12300.000,23580.000
4,12200.000,23450.000
5,12320.000,23390.000`;
  }
}

function doImport() {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) { showImportMsg('テキストを入力してください', false); return; }
  try {
    const parsed = coordType === 'latlon'
      ? parseLatLon(text)
      : parsePlaneXY(text, selectedZone);
    applyPoints(parsed);
    showImportMsg(`${parsed.length} 点を読み込みました`, true);
    setTimeout(() => switchTab('nav'), 800);
  } catch(e) {
    showImportMsg(e.message, false);
  }
}

function applyPoints(parsed) {
  points = parsed;
  curIdx = 0;
  updateNav();
  renderPointList();
  updateMapMarkers();
}

function showImportMsg(text, ok) {
  const el = document.getElementById('importMsg');
  el.innerHTML = `<div class="msg ${ok?'ok':'err'}">${ok?'✅':'❌'} ${text}</div>`;
  if (ok) setTimeout(() => el.innerHTML='', 4000);
}

// File import
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('pasteArea').value = ev.target.result;
    doImport();
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = ''; // reset
});

// ═══════════════════════════════════════════════════════
// ZONE SHEET
// ═══════════════════════════════════════════════════════
function buildZoneList() {
  const el = document.getElementById('zoneList');
  el.innerHTML = ZONES.map(z => `
    <div class="zone-item" onclick="selectZone(${z.n})">
      <div>
        <div class="zone-item-name">${z.name}</div>
        <div class="zone-item-region">${z.region}</div>
      </div>
      <span class="zone-item-check" id="zcheck-${z.n}" style="display:${z.n===selectedZone?'block':'none'}">✓</span>
    </div>`).join('');
}

function openZoneSheet() { buildZoneList(); document.getElementById('zoneOverlay').classList.add('open'); }
function closeZoneSheet(e) {
  if (e.target === document.getElementById('zoneOverlay')) {
    document.getElementById('zoneOverlay').classList.remove('open');
  }
}
function selectZone(n) {
  selectedZone = n;
  const z = ZONES.find(z=>z.n===n);
  document.getElementById('zoneName').textContent = z.name;
  document.getElementById('zoneRegion').textContent = z.region;
  document.getElementById('zoneOverlay').classList.remove('open');
}

// ═══════════════════════════════════════════════════════
// GOOGLE MAPS
// ═══════════════════════════════════════════════════════
window.initMap = function() {
  const center = points.length
    ? { lat: points[0].lat, lng: points[0].lon }
    : { lat: 38.2683, lng: 140.8694 };

  gMap = new google.maps.Map(document.getElementById('map'), {
    center, zoom: 17,
    mapTypeId: 'hybrid',
    disableDefaultUI: true,
    gestureHandling: 'greedy',
    styles: [{ featureType:'all', elementType:'labels.text', stylers:[{color:'#ffffff'}] }]
  });

  // My location marker (blue dot)
  myMarker = new google.maps.Marker({
    map: gMap,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 8, fillColor: '#3b82f6', fillOpacity: 1,
      strokeColor: '#fff', strokeWeight: 2
    },
    zIndex: 10
  });

  gMap.addListener('drag', () => { followMap = false; updateFollowBtn(); });
  updateMapMarkers();
};

function updateMapTarget() {
  if (!gMap || !points.length) return;
  const p = points[curIdx];
  if (targetMarker) targetMarker.setPosition({ lat: p.lat, lng: p.lon });
}

function updateMapMarkers() {
  if (!gMap) return;
  allMarkers.forEach(m => m.setMap(null));
  allMarkers = [];
  if (polyline) { polyline.setMap(null); polyline = null; }
  if (!points.length) return;

  // Polyline
  const path = points.map(p => ({ lat: p.lat, lng: p.lon }));
  polyline = new google.maps.Polyline({
    path, map: gMap,
    strokeColor: '#3b82f6', strokeOpacity: 0.5, strokeWeight: 2
  });

  // Markers
  points.forEach((p, i) => {
    const isActive = i === curIdx;
    const color = p.arrived ? '#22c55e' : isActive ? '#3b82f6' : '#64748b';
    const label = p.arrived ? '✓' : p.no;
    const marker = new google.maps.Marker({
      position: { lat: p.lat, lng: p.lon },
      map: gMap,
      title: p.name,
      label: { text: label, color: '#fff', fontSize: '11px', fontWeight: '700' },
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: isActive ? 14 : 10,
        fillColor: color, fillOpacity: 1,
        strokeColor: '#fff', strokeWeight: 2
      },
      zIndex: isActive ? 5 : 2
    });
    marker.addListener('click', () => selectPoint(i));
    allMarkers.push(marker);
  });

  targetMarker = allMarkers[curIdx] || null;
}

function toggleFollow() {
  followMap = !followMap;
  updateFollowBtn();
  if (followMap && myLat !== null && gMap) {
    gMap.panTo({ lat: myLat, lng: myLon });
  }
}
function updateFollowBtn() {
  document.getElementById('followBtn').classList.toggle('following', followMap);
}

function loadGoogleMaps() {
  const key = window.GMAP_KEY || '';
  if (!key || key === 'YOUR_GOOGLE_MAPS_API_KEY_HERE') {
    document.getElementById('map').innerHTML =
      `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#64748b;font-size:13px;padding:24px;text-align:center">
        Google Maps APIキーが設定されていません。<br>index.htmlの GMAP_KEY を設定してください。
      </div>`;
    return;
  }
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${key}&callback=initMap&v=weekly`;
  s.async = true; s.defer = true;
  document.head.appendChild(s);
}

// ═══════════════════════════════════════════════════════
// TAB SWITCHING
// ═══════════════════════════════════════════════════════
function switchTab(name) {
  ['nav','map','points','import'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t===name);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('map-container').style.display = 'none';

  if (name === 'map') {
    document.getElementById('map-container').style.display = 'block';
    updateMapMarkers();
  } else {
    document.getElementById(`page-${name}`).classList.add('active');
  }

  if (name === 'nav') {
    requestCompassPermission();
  }
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  initGPS();
  initCompass();
  initThreshold();
  drawCompass(0);
  loadGoogleMaps();
  updateFormatHint();
  buildZoneList();
  renderPointList();

  // Restore last zone
  const saved = localStorage.getItem('zone');
  if (saved) {
    const z = ZONES.find(z=>z.n===+saved);
    if (z) { selectedZone = z.n; document.getElementById('zoneName').textContent=z.name; document.getElementById('zoneRegion').textContent=z.region; }
  }
});
